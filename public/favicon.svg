<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>مخيال</title>
  <!-- The monogram from the brand guide §02: «م» over the film strip. Outlined
       from IBM Plex Sans Arabic SemiBold, because a favicon is rendered
       standalone and never receives the page's webfont, so a text element here
       would fall back to a system face and stop being the brand mark. Kept in
       lockstep with the Monogram component in src/components/Logo.jsx: same 64
       box, same paths, same 4 stroke, same 9/3.5 dash. Change one, change both.

       CAUTION: this file is parsed as XML, not HTML. A comment may not contain
       two consecutive hyphens anywhere inside it, so CSS custom properties
       cannot be named here in prose. Writing the accent token's name in this
       comment is what made an earlier version of this file fail to parse — it
       returned HTTP 200 and rendered nothing at all, which is the worst kind
       of broken. Both colours below are palette values: the light accent, and
       the dark-theme accent for a dark tab strip where 1B5E43 disappears. -->
  <style>
    svg { --m: #1B5E43; }
    @media (prefers-color-scheme: dark) { svg { --m: #56A883; } }
  </style>
