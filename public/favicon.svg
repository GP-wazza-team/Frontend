<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <title>Wazza</title>
  <!-- THE GATE. A chamfered plate carrying three ascending meter ticks.
       Two ticks are hollow (free). The tallest is filled (it costs money).
       That is the whole product rule, in the logo. -->
  <style>
    svg { --m: #191A14; }
    @media (prefers-color-scheme: dark) { svg { --m: #EDEADB; } }
  </style>
  <g fill="none" stroke="var(--m)" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M2 2 H14.5 L18 5.5 V18 H2 Z"/>
    <path d="M6 14 V11"/>
    <path d="M10 14 V8.5"/>
  </g>
  <rect x="12.25" y="4.5" width="2.5" height="9.5" fill="#E3A32B"/>
</svg>
