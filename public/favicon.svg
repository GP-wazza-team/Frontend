<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <title>Wazza</title>
  <!-- THE SEALED SQUARE. A square with its top-end corner cut, and one rule
       across it at the baseline position: the seal and the jadwal. A cut
       corner means this record was issued and cannot be issued again; the
       rule is the ruled line of a set page. Monochrome — the brand mark does
       not spend one of the two accent appearances L3 permits per viewport,
       which is what the old amber meter bar did. -->
  <style>
    svg { --m: #1E1913; }
    @media (prefers-color-scheme: dark) { svg { --m: #F0E9DE; } }
  </style>
  <g fill="none" stroke="var(--m)" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M2 2 H14.5 L18 5.5 V18 H2 Z"/>
    <path d="M2 13 H18"/>
  </g>
</svg>
