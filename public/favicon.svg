<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20">
  <title>Wazza</title>
  <!-- A rounded square with one rule across it. Kept in lockstep with the
       <Mark> component in src/components/Icon.jsx: same 14.4 box, same rx 3.2,
       same 1.6 stroke, same round caps and joins. If one changes, change both
       or the tab icon stops being the brand mark. -->
  <style>
    svg { --m: #191512; }
    @media (prefers-color-scheme: dark) { svg { --m: #F2EDE4; } }
  </style>
  <g fill="none" stroke="var(--m)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.8" y="2.8" width="14.4" height="14.4" rx="3.2"/>
    <path d="M2.8 12.4 H17.2"/>
  </g>
</svg>
