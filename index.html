<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets env(safe-area-inset-*) report real values, which
         is what keeps the status bar clear of the notch and the composer clear
         of the home indicator. Without it those insets are all 0 and the
         .safe-inset classes in index.css do nothing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Wazza</title>
    <meta name="description" content="Wazza is a production console for AI-generated scripts, images and video. Plan a job, review the work order, authorise the spend, watch the run." />

    <!-- The mark: a chamfered plate carrying three ascending meter ticks, the
         tallest one filled. Hollow is free, filled costs money - the same rule
         the whole interface runs on. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#14150F" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#E9EBE2" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
