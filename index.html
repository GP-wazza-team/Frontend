<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets env(safe-area-inset-*) report real values, which
         is what keeps the status bar clear of the notch and the composer clear
         of the home indicator. Without it those insets are all 0 and the
         .safe-inset classes in index.css do nothing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Wazza</title>
    <meta name="description" content="Wazza is a production console for AI-generated scripts, images and video. Plan a job, review the work order, authorise the spend, watch the run." />

    <!-- The mark: the sealed square. A square with the 45 degree corner cut
         and one rule at the baseline - the jadwal and the seal. L2 drawn: a
         cut corner means this record was issued and cannot be issued again. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#191411" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#E3DCD3" media="(prefers-color-scheme: light)" />
    <!-- Light first: light is the product and the theme the decisions are made
         in. Dark is derived. -->
    <meta name="color-scheme" content="light dark" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
